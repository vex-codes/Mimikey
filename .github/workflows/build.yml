name: Build Mimikey for Mac and Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Imports and PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    # --- WINDOWS COMPILATION ---
    - name: Compile for Windows
      if: matrix.os == 'windows-latest'
      run: pyinstaller --noconsole --onefile --icon=icon.ico --collect-all customtkinter mimikey.py
      
    - name: Upload Windows EXE
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Mimikey-Windows
        path: dist/*.exe

    # --- MAC COMPILATION ---
    - name: Compile for Mac
      if: matrix.os == 'macos-latest'
      run: pyinstaller --windowed --onefile --icon=icon.icns --collect-all customtkinter mimikey.py
      
    - name: Upload Mac App
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Mimikey-Mac
        path: dist/*.app
